<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ViewAble Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="page">
      <h1>ViewAble settings</h1>
      <p class="sub">
        Customize how ViewAble simplifies pages and reads content.
      </p>

      <section class="card">
        <h2>Reading behavior</h2>
        <label class="toggle">
          <input type="checkbox" id="enabled" />
          <span>Enable ViewAble by default</span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="readerMode" />
          <span>Use reader mode by default</span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="dyslexicFont" />
          <span>Use dyslexic-friendly font by default</span>
        </label>

        <label class="toggle">
          <input type="checkbox" id="highContrast" />
          <span>Use high contrast by default</span>
        </label>
      </section>

      <section class="card">
        <h2>Appearance</h2>
        <label class="range-label">
          Text size
          <input type="range" id="textSize" min="0.9" max="1.4" step="0.05" />
        </label>

        <label class="range-label">
          Line spacing
          <input type="range" id="lineSpacing" min="1" max="1.8" step="0.1" />
        </label>

        <label class="select-label">
          Theme
          <select id="theme">
            <option value="auto">Auto (follow system)</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </section>

      <button id="reset" class="reset">Reset to defaults</button>
      <p class="hint">Changes are saved automatically.</p>
    </main>

    <script src="options.js"></script>
  </body>
</html>
