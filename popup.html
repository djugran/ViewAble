<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>ViewAble</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-root">
      <div id="tabs" class="tabs">
        <button id="tab-main" class="tab active">Tools</button>
        <button id="tab-settings" class="tab">Settings</button>
      </div>

      <div id="panel-main" class="panel">
        <button id="reader-mode" class="btn btn-primary btn-full">Simplify page</button>

        <div class="spacer"></div>

        <button id="summarize" class="btn btn-secondary btn-full">Summarize</button>

        <div class="card-row">
          <button id="toggle-dyslexic" class="btn btn-toggle-card">
            <span class="btn-title">Dyslexic font</span>
          </button>
          <button id="toggle-contrast" class="btn btn-toggle-card">
            <span class="btn-title">High contrast</span>
          </button>
        </div>

        <div class="text-size-row">
          <span class="text-size-label">Text size</span>
          <div class="text-size-buttons">
            <button id="decrease-text" class="btn btn-pill">A-</button>
            <button id="reset-text" class="btn btn-pill">A</button>
            <button id="increase-text" class="btn btn-pill">A+</button>
          </div>
        </div>

        <button id="read-aloud" class="btn btn-primary btn-full">Read aloud</button>

        <button id="quiz-button" class="btn btn-outline btn-full">
          Finished reading? Test your understanding
        </button>

        <section id="summary-section" class="summary-card" hidden>
          <h3 class="summary-title">Summary</h3>
          <p id="summary-text" class="summary-text"></p>
        </section>
      </div>

      <div id="panel-settings" class="panel" hidden>
        <div class="field">
          <span class="field-label">Voice</span>
          <button id="voice-toggle" class="voice-toggle is-male">
            <span class="voice-toggle-option voice-toggle-option-left">Male</span>
            <span class="voice-toggle-knob"></span>
            <span class="voice-toggle-option voice-toggle-option-right">Female</span>
          </button>
        </div>

        <div class="field">
          <span class="field-label">Volume</span>
          <input id="voice-volume" type="range" min="0" max="1" step="0.05" />
        </div>

        <div class="field">
          <span class="field-label">Speed</span>
          <input id="voice-speed" type="range" min="0.5" max="2" step="0.1" value="1" />
        </div>

        <div class="field">
          <span class="field-label">Simplify language</span>
          <select id="language-select">
            <option value="English">English</option>
            <option value="Spanish">Spanish</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Italian">Italian</option>
            <option value="Dutch">Dutch</option>
            <option value="Russian">Russian</option>
            <option value="Japanese">Japanese</option>
            <option value="Chinese (Simplified)">Chinese (Simplified)</option>
            <option value="Korean">Korean</option>
            <option value="Arabic">Arabic</option>
            <option value="Hindi">Hindi</option>
            <option value="Turkish">Turkish</option>
            <option value="Polish">Polish</option>
            <option value="Swedish">Swedish</option>
          </select>
        </div>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
